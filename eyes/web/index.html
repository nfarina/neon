<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Neon</title>
<style>
  html, body { margin: 0; height: 100%; background: #04060a; overflow: hidden; cursor: none; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #debug {
    position: fixed; left: 0; right: 0; bottom: 0; display: none;
    gap: 22px; padding: 10px 18px; flex-wrap: wrap;
    font: 12px ui-monospace, SFMono-Regular, monospace;
    color: #7fd8e8; background: rgba(4, 10, 14, 0.72);
    border-top: 1px solid rgba(102, 224, 255, 0.15);
  }
  #debug b { color: #cfeeff; font-weight: 600; margin-left: 6px; }
  #legend {
    position: fixed; top: 18px; left: 18px; display: none;
    padding: 12px 18px; border-radius: 10px; line-height: 1.8;
    font: 12px ui-monospace, SFMono-Regular, monospace;
    color: #7fd8e8; background: rgba(4, 10, 14, 0.82);
    border: 1px solid rgba(102, 224, 255, 0.18);
  }
  #legend b { color: #cfeeff; font-weight: 600; display: inline-block; min-width: 40px; }
  #badge {
    position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
    padding: 7px 16px; border-radius: 999px; opacity: 0;
    font: 13px ui-monospace, SFMono-Regular, monospace;
    color: #cfeeff; background: rgba(4, 10, 14, 0.82);
    border: 1px solid rgba(102, 224, 255, 0.22);
    transition: opacity 0.25s;
  }
  /* The kitchen timer: its own thing, bottom centre, nothing to do with
     tasks. Quiet while counting; unmissable when it rings. */
  #timer {
    position: fixed; left: 50%; bottom: 46px; transform: translateX(-50%);
    display: none; align-items: baseline; gap: 14px; padding: 10px 24px;
    border-radius: 999px; white-space: nowrap;
    font: 15px ui-monospace, SFMono-Regular, monospace;
    color: #9fd6e6; background: rgba(4, 12, 18, 0.7);
    border: 1px solid rgba(102, 224, 255, 0.16);
  }
  #timer.on { display: flex; }
  #timer .tlabel { color: #7fb9cc; }
  #timer .tclock { font-size: 30px; color: #cfeeff; font-variant-numeric: tabular-nums; }
  /* Ringing: amber, larger, and pulsing — readable from the far counter. */
  #timer.ringing {
    color: #ffd9a0; background: rgba(30, 14, 2, 0.82);
    border-color: rgba(255, 184, 92, 0.5);
    animation: alarm 1.1s ease-in-out infinite;
  }
  #timer.ringing .tclock { color: #ffb85c; font-size: 34px; }
  #timer.ringing .tlabel { color: #ffd9a0; }
  #timer .thint { color: #8a6a44; font-size: 12px; }
  @keyframes alarm {
    0%, 100% { box-shadow: 0 0 0 0 rgba(255, 184, 92, 0.0); transform: translateX(-50%) scale(1); }
    50%      { box-shadow: 0 0 34px 6px rgba(255, 184, 92, 0.30); transform: translateX(-50%) scale(1.04); }
  }

  /* Tasks: what Neon has running, down the left edge. Deliberately quiet —
     it shares the screen with a face, and a countdown should be glanceable
     from across the kitchen without competing with her. */
  #tasks {
    position: fixed; left: 26px; top: 50%; transform: translateY(-50%);
    display: flex; flex-direction: column; gap: 14px;
    font: 13px ui-monospace, SFMono-Regular, monospace;
    pointer-events: none;
  }
  .task { display: flex; align-items: center; gap: 10px; opacity: 0.92; }
  .task.gone { opacity: 0; transition: opacity 1.2s; }
  .dot {
    width: 8px; height: 8px; border-radius: 50%; flex: none;
    background: #66e0ff; box-shadow: 0 0 10px 1px rgba(102, 224, 255, 0.7);
  }
  .task.running .dot { animation: taskpulse 2.4s ease-in-out infinite; }
  .task.done .dot { background: #7dffc4; box-shadow: 0 0 12px 2px rgba(125, 255, 196, 0.8); }
  .task.cancelled .dot, .task.failed .dot {
    background: #4a6672; box-shadow: none;
  }
  .task .label { color: #9fd6e6; }
  .task.done .label { color: #7dffc4; }
  .task.cancelled .label, .task.failed .label { color: #587585; }
  .task .clock { color: #cfeeff; font-variant-numeric: tabular-nums; }
  @keyframes taskpulse {
    0%, 100% { opacity: 0.45; transform: scale(0.85); }
    50%      { opacity: 1;    transform: scale(1.15); }
  }

  /* Event log: a running trace of the conversation's machinery down the
     right edge — sessions, transcripts both ways, tools, sleeps. */
  #events {
    position: fixed; top: 0; right: 0; bottom: 0; width: 30vw;
    min-width: 320px; max-width: 460px; display: none;
    overflow-y: auto; overscroll-behavior: contain;
    padding: 10px 14px 16px;
    font: 11px/1.45 ui-monospace, SFMono-Regular, monospace;
    background: rgba(3, 8, 12, 0.86);
    border-left: 1px solid rgba(102, 224, 255, 0.16);
    -webkit-mask-image: linear-gradient(to bottom, transparent, #000 22px);
  }
  #events::-webkit-scrollbar { width: 0; }
  .ev { display: flex; gap: 7px; padding: 2px 0; align-items: baseline; }
  .evt { color: #3d5b68; flex: none; }
  .evk { color: #4e7d8c; flex: none; width: 46px; text-align: right; }
  .evm { color: #9fd6e6; word-break: break-word; }
  .ev-you   .evk, .ev-you   .evm { color: #eaf6ff; }
  .ev-neon  .evk, .ev-neon  .evm { color: #66e0ff; }
  .ev-tool  .evk, .ev-tool  .evm { color: #ffcf7a; }
  .ev-think .evk, .ev-think .evm { color: #b3a8ff; }
  .ev-emote .evk, .ev-emote .evm { color: #ff9ec8; }
  .ev-wake  .evk, .ev-wake  .evm { color: #7dffc4; }
  .ev-sleep .evk, .ev-sleep .evm { color: #6a8a97; }
  .ev-error .evk, .ev-error .evm { color: #ff8f8f; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="debug"></div>
<div id="legend">
  <div><b>W</b> wake</div>
  <div><b>S</b> end session</div>
  <div><b>D</b> debug overlay</div>
  <div><b>L</b> event log</div>
  <div><b>E</b> cycle engine</div>
  <div><b>T</b> ghost mode</div>
  <div><b>P</b> preview states</div>
  <div><b>X</b> cycle emotes</div>
  <div><b>Tab</b> hold for this legend</div>
  <!-- The quit chord is deliberately not listed: anyone who can read this
       legend is standing at the kitchen counter, and it is the one shortcut
       that gets them off Neon and into Nick's session. It lives in AGENTS.md. -->
</div>
<div id="badge"></div>
<div id="tasks"></div>
<div id="timer"></div>
<div id="events"></div>
<script>
"use strict";

// ============================================================ setup
const cv = document.getElementById("c");
const ctx = cv.getContext("2d");
let W = 0, H = 0, DPR = 1;
function resize() {
  DPR = Math.min(devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
}
addEventListener("resize", resize);
resize();

// ============================================================ easing
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rand = (a, b) => a + Math.random() * (b - a);
const easeOutCubic = t => 1 - Math.pow(1 - t, 3);
const easeInCubic  = t => t * t * t;
const easeInOutCubic = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const easeOutQuint = t => 1 - Math.pow(1 - t, 5);
const easeOutBack = t => { const c = 2.0; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };

// ============================================================ animation channels
// A channel is a value that tweens toward a target. All timing in seconds.
let now = 0;
function ch(v) { return { v, from: v, to: v, t0: 0, dur: 0, ease: easeInOutCubic }; }
function to(c, target, dur, ease) {
  c.from = c.v; c.to = target; c.t0 = now; c.dur = dur; c.ease = ease || easeInOutCubic;
}
function tickCh(c) {
  if (c.dur <= 0) { c.v = c.to; return; }
  const t = clamp((now - c.t0) / c.dur, 0, 1);
  c.v = c.from + (c.to - c.from) * c.ease(t);
  if (t >= 1) c.dur = 0;
}

const S = {
  open:  ch(0.07),  // 0 closed .. 1 open (may overshoot slightly)
  blink: ch(1),     // multiplier for blinks, 1 = eyes as open as `open` allows
  gx:    ch(0),     // gaze -1..1
  gy:    ch(0.24),
  lum:   ch(0.35),  // brightness: dim asleep, bright awake
  dim:   ch(1),     // master output level; deep sleep fades this to an ember
  think: ch(0),     // 0..1 blend of the thinking look
  winkL: ch(1),     // per-eye open multipliers (1 = follow the pair)
  winkR: ch(1),
  hueX:  ch(0),     // hue offset from cyan (love goes pink)
  // Shape channels. Brightness and openness are already busy carrying
  // speech, hearing and breathing, so emotes that only push those read as
  // noise. These change the eyes' silhouette instead, which nothing else
  // touches — the reason `confused` (asymmetric lids) always landed.
  brow:  ch(0),     // -1 outer-down (sad) .. +1 inner-down (stern//determined)
  curve: ch(0),     // 0 .. 1 bottom eaten into a happy ^^ crescent
  pop:   ch(1),     // uniform scale, for surprise and heartbeats
  offL:  ch(0),     // per-eye vertical offset in eye-heights (bounce, tilt)
  offR:  ch(0),
};

// scheduled one-shot tasks, driven by the frame clock
let tasks = [];
function after(d, fn) { tasks.push({ at: now + d, fn }); }
function cancelTasks() { tasks = []; }
function runTasks() {
  const due = tasks.filter(t => now >= t.at);
  tasks = tasks.filter(t => now < t.at);
  for (const t of due) t.fn();
}

// ============================================================ behaviors
const AWAKE_SECS = 8;
let state = "asleep";
let awakeUntil = 0;
let hold = false;             // a live voice session keeps the eyes awake
let speakAmp = 0, speakTarget = 0;  // output-audio level while Neon talks
let hearAmp = 0, hearTarget = 0;    // room-voice level while someone talks to her
let transparent = false;      // ghost mode: eyes float over whatever's behind
let deep = false;             // deep sleep: eyes down to an ember, backlight with them
let thinking = false;         // model is reasoning: gaze drifts up, soft shimmer
let thinkFlip = 1;

function blinkOnce(cb) {
  to(S.blink, 0, 0.07, easeInCubic);
  after(0.07, () => {
    to(S.blink, 1, 0.13, easeOutCubic);
    if (cb) after(0.13, cb);
  });
}

function glanceTo(x, y) {
  to(S.gx, x, 0.09, easeOutQuint);
  to(S.gy, y, 0.09, easeOutQuint);
}

let wakeStartedAt = 0;
function wake() {
  if (deep) window.neon.deepSleep(false);  // any wake path lifts the ember
  if (state === "awake") { awakeUntil = now + AWAKE_SECS; return; }
  cancelTasks();
  state = "waking";
  wakeStartedAt = now;
  clearEmote();         // cancelTasks may have orphaned a mid-emote restore
  to(S.blink, 1, 0.1);  // heal a blink orphaned mid-close by cancelTasks
  to(S.gx, 0, 0.18); to(S.gy, 0, 0.18);
  to(S.lum, 1, 0.35);
  to(S.open, 1.14, 0.16, easeOutBack);            // snap open with overshoot
  after(0.18, () => to(S.open, 1, 0.12, easeOutCubic)); // settle
  after(0.5, () => blinkOnce());                   // settling blink
  after(0.85, () => glanceTo(-0.35, -0.06));       // look around, curious
  after(1.35, () => glanceTo(0.35, -0.02));
  after(1.85, () => {
    state = "awake";
    awakeUntil = now + AWAKE_SECS;
    saccadeLoop();
    blinkLoop();
  });
}

function saccadeLoop() {
  if (state !== "awake") return;
  after(rand(0.6, 2.4), () => {
    if (state !== "awake") return;
    if (!thinking) {
      if (hearAmp > 0.25) {
        // Someone's talking to her: hold an attentive, near-center gaze
        // with only tiny shifts, like meeting the speaker's eyes.
        glanceTo(rand(-0.1, 0.1), rand(-0.04, 0.12));
      } else {
        glanceTo(rand(-0.45, 0.45), rand(-0.22, 0.28));
      }
    }
    saccadeLoop();
  });
}

// The thinking look itself is continuous (scan + pulse), driven by S.think
// in draw(); no scheduled glances needed.

// ============================================================ emotes
// Short one-shot expressions the model triggers via its emote tool.
function clearEmote() {
  to(S.winkL, 1, 0.2); to(S.winkR, 1, 0.2); to(S.hueX, 0, 0.3);
  to(S.brow, 0, 0.25); to(S.curve, 0, 0.25); to(S.pop, 1, 0.25);
  to(S.offL, 0, 0.25); to(S.offR, 0, 0.25);
}
// Every emote should be recognisable in silhouette, with the shape held long
// enough to register (~1.5 s) — a fast flicker of brightness reads as a
// rendering glitch, not a feeling.
const EMOTES = {
  happy() {
    to(S.curve, 0.85, 0.22, easeOutCubic);   // ^^ crescents
    to(S.open, 1.05, 0.22); to(S.lum, 1.05, 0.2);
    after(1.5, () => { to(S.curve, 0, 0.3); to(S.open, 1, 0.35); to(S.lum, 1, 0.4); });
  },
  laugh() {
    to(S.curve, 0.92, 0.16, easeOutCubic);
    to(S.lum, 1.12, 0.15);
    for (let i = 0; i < 4; i++) {          // the shoulders-shaking bounce
      after(0.16 + i * 0.24, () => {
        to(S.offL, -0.09, 0.1); to(S.offR, -0.09, 0.1); to(S.pop, 1.06, 0.1);
        after(0.12, () => { to(S.offL, 0.05, 0.11); to(S.offR, 0.05, 0.11); to(S.pop, 0.98, 0.11); });
      });
    }
    after(1.5, () => {
      to(S.curve, 0, 0.3); to(S.lum, 1, 0.35); to(S.pop, 1, 0.25);
      to(S.offL, 0, 0.25); to(S.offR, 0, 0.25);
    });
  },
  surprised() {
    to(S.pop, 1.32, 0.09, easeOutBack);     // both eyes go wide, fast
    to(S.open, 1.2, 0.09, easeOutBack); to(S.lum, 1.15, 0.1);
    glanceTo(0, -0.06);
    after(0.5, () => to(S.pop, 1.18, 0.18));     // a small double-take
    after(0.72, () => to(S.pop, 1.3, 0.12, easeOutBack));
    after(1.35, () => { to(S.pop, 1, 0.3); to(S.open, 1, 0.3); to(S.lum, 1, 0.4); });
  },
  wink() {
    to(S.winkR, 0.02, 0.11, easeInCubic);
    to(S.curve, 0.6, 0.14);                 // the other eye smiles along
    to(S.offR, 0.05, 0.12);
    after(0.55, () => {
      to(S.winkR, 1, 0.2, easeOutCubic); to(S.curve, 0, 0.25); to(S.offR, 0, 0.2);
    });
  },
  sad() {
    to(S.brow, -0.7, 0.5);                  // outer corners droop
    to(S.open, 0.62, 0.7); to(S.gy, 0.34, 0.8); to(S.lum, 0.5, 0.9);
    to(S.offL, 0.05, 0.7); to(S.offR, 0.05, 0.7);
    after(2.4, () => {
      to(S.brow, 0, 0.5); to(S.open, 1, 0.5); to(S.gy, 0, 0.5); to(S.lum, 1, 0.6);
      to(S.offL, 0, 0.5); to(S.offR, 0, 0.5);
    });
  },
  // Untouched: the asymmetry already makes this the most legible of the set,
  // and it's the one Nick singled out. Don't "improve" it.
  confused() {
    to(S.winkL, 0.5, 0.25); to(S.gx, 0.28, 0.3); to(S.gy, -0.1, 0.3);
    after(1.8, () => { to(S.winkL, 1, 0.25); glanceTo(0, 0); });
  },
  eyeroll() {
    to(S.brow, 0.45, 0.25);                 // the lids come down on it
    to(S.open, 0.8, 0.25);
    glanceTo(0.4, -0.1);
    after(0.25, () => glanceTo(0.25, -0.5));
    after(0.5, () => glanceTo(-0.2, -0.55));
    after(0.8, () => glanceTo(-0.35, -0.1));
    after(1.15, () => { glanceTo(0, 0); to(S.brow, 0, 0.35); to(S.open, 1, 0.35); });
  },
  excited() {
    to(S.lum, 1.18, 0.12); to(S.curve, 0.45, 0.15);
    const hop = (t, up) => after(t, () => {
      to(S.pop, up ? 1.22 : 0.96, 0.11, up ? easeOutBack : easeOutCubic);
      to(S.offL, up ? -0.07 : 0.02, 0.11); to(S.offR, up ? -0.07 : 0.02, 0.11);
    });
    hop(0, true); hop(0.24, false); hop(0.44, true); hop(0.68, false); hop(0.86, true);
    after(1.2, () => {
      to(S.pop, 1, 0.2); to(S.curve, 0, 0.3); to(S.lum, 1, 0.4);
      to(S.offL, 0, 0.2); to(S.offR, 0, 0.2);
    });
  },
  love() {
    to(S.hueX, 139, 0.3); to(S.curve, 0.7, 0.3); to(S.lum, 1.1, 0.3);
    const beat = t => {                     // two thumps, like a heartbeat
      after(t, () => to(S.pop, 1.18, 0.13, easeOutBack));
      after(t + 0.16, () => to(S.pop, 1.0, 0.18));
    };
    beat(0.3); beat(0.62); beat(1.3); beat(1.62);
    after(2.2, () => {
      to(S.hueX, 0, 0.6); to(S.curve, 0, 0.4); to(S.lum, 1, 0.5); to(S.pop, 1, 0.3);
    });
  },
};

function blinkLoop() {
  if (state !== "awake") return;
  after(rand(2.2, 6.0), () => {
    if (state !== "awake") return;
    blinkOnce();
    if (Math.random() < 0.15) after(0.3, () => blinkOnce()); // occasional double blink
    blinkLoop();
  });
}

function drowse() {
  cancelTasks();
  state = "drowsy";
  clearEmote();
  to(S.blink, 1, 0.1);
  to(S.open, 0.5, 1.3, easeInOutCubic);
  to(S.gy, 0.28, 1.5); to(S.gx, 0, 1.0);
  to(S.lum, 0.6, 1.5);
  after(1.7, () => { // one slow heavy blink
    to(S.blink, 0, 0.3, easeInCubic);
    after(0.35, () => to(S.blink, 1, 0.45, easeOutCubic));
  });
  after(3.0, () => {
    state = "sleeping";
    to(S.open, 0.07, 1.5, easeInCubic);
    to(S.gy, 0.24, 1.5);
    to(S.lum, 0.35, 1.6);
    after(1.6, () => { state = "asleep"; sleepTwitchLoop(); });
  });
}

function sleepTwitchLoop() {
  if (state !== "asleep") return;
  after(rand(8, 18), () => {
    if (state !== "asleep") return;
    // a tiny stir: eyes shift under the lids
    to(S.gx, rand(-0.08, 0.08), 0.5);
    after(0.7, () => to(S.gx, 0, 0.9));
    sleepTwitchLoop();
  });
}

function sleep() {
  cancelTasks();
  state = "sleeping";
  clearEmote();
  to(S.blink, 1, 0.1);
  to(S.open, 0.07, 0.9, easeInCubic);
  to(S.gx, 0, 0.9); to(S.gy, 0.24, 0.9);
  to(S.lum, 0.35, 1.0);
  after(1.0, () => { state = "asleep"; sleepTwitchLoop(); });
}

sleepTwitchLoop(); // start life in asleep state

// ============================================================ state preview
// Cycle through the visual states with synthetic drivers, for eyeballing
// animations without a live session. P advances; last step returns to sleep.
let preview = null;   // "hearing" | "speaking" while synthesized in frame()
const previewStates = ["awake", "hearing", "thinking", "speaking", "off"];
let previewIx = -1;
let badgeTimer = null;
function badge(text) {
  const el = document.getElementById("badge");
  el.textContent = text;
  el.style.opacity = 1;
  clearTimeout(badgeTimer);
  badgeTimer = setTimeout(() => { el.style.opacity = 0; }, 1600);
}
// The preview is a per-frame override: while set, frame() pins the renderer
// to that look no matter what the live mechanics say. "off" returns control.
function previewNext() {
  previewIx = (previewIx + 1) % previewStates.length;
  const p = previewStates[previewIx];
  if (p === "off") {
    preview = null;
    window.neon.thinking(false);
    badge("preview off — live");
    previewIx = -1;
    return;
  }
  preview = p;
  badge(`preview: ${p}`);
}

// ============================================================ event log
// A running trace of what actually happened, kept whether or not the panel
// is visible — toggling it on mid-conversation should show the history, not
// an empty box.
const EV_MAX = 400;
const EV_COALESCE = { you: true, neon: true };  // streamed transcript fragments
let lastEv = null;
function evClock() {
  const d = new Date();
  return [d.getHours(), d.getMinutes(), d.getSeconds()]
    .map(n => String(n).padStart(2, "0")).join(":");
}
function evScroll() {
  const box = document.getElementById("events");
  box.scrollTop = box.scrollHeight;
}
function pushEvent(kind, text) {
  const box = document.getElementById("events");
  const stamp = Date.now();
  // Transcripts arrive in fragments ("set a", " timer for", " ten minutes").
  // Grow the existing line instead of stacking one row per fragment.
  if (lastEv && lastEv.kind === kind && EV_COALESCE[kind] && stamp - lastEv.at < 10000) {
    lastEv.at = stamp;
    lastEv.text += /^[\s,.!?';:]/.test(text) ? text : " " + text;
    lastEv.el.textContent = lastEv.text;
    evScroll();
    return;
  }
  const row = document.createElement("div");
  row.className = "ev ev-" + kind;
  const t = document.createElement("span"); t.className = "evt"; t.textContent = evClock();
  const k = document.createElement("span"); k.className = "evk"; k.textContent = kind;
  const m = document.createElement("span"); m.className = "evm"; m.textContent = text;
  row.append(t, k, m);
  box.appendChild(row);
  while (box.childElementCount > EV_MAX) box.removeChild(box.firstChild);
  lastEv = { kind, at: stamp, text, el: m };
  evScroll();
}

// ============================================================ tasks
// The shell pushes the list whenever it changes; the countdown ticks here
// rather than over the bridge, so a running timer costs nothing per second.
let taskList = [];
function renderTasks() {
  const box = document.getElementById("tasks");
  box.innerHTML = "";
  for (const t of taskList) {
    const row = document.createElement("div");
    row.className = "task " + t.status;
    const dot = document.createElement("span"); dot.className = "dot";
    const label = document.createElement("span"); label.className = "label";
    label.textContent = t.title;
    row.append(dot, label);
    if (t.status === "running" && typeof t.remaining === "number") {
      const left = Math.max(0, Math.round(t.remaining - (Date.now() - t.at) / 1000));
      const clock = document.createElement("span"); clock.className = "clock";
      clock.textContent = left >= 3600
        ? `${Math.floor(left / 3600)}h${String(Math.floor(left % 3600 / 60)).padStart(2, "0")}`
        : `${Math.floor(left / 60)}:${String(left % 60).padStart(2, "0")}`;
      row.append(clock);
    }
    box.appendChild(row);
  }
}
setInterval(() => { if (taskList.some(t => t.status === "running")) renderTasks(); }, 1000);

// ============================================================ kitchen timer
// One timer, its own pill at the bottom, no relation to the task list. The
// countdown runs here so a ticking clock costs nothing across the bridge.
let timerState = null;
function renderTimer() {
  const el = document.getElementById("timer");
  if (!timerState || !timerState.active) { el.className = ""; el.innerHTML = ""; return; }
  const ringing = !!timerState.ringing;
  el.className = "on" + (ringing ? " ringing" : "");
  const left = ringing ? 0
    : Math.max(0, Math.round(timerState.remaining - (Date.now() - timerState.at) / 1000));
  const clock = left >= 3600
    ? `${Math.floor(left / 3600)}:${String(Math.floor(left % 3600 / 60)).padStart(2, "0")}:${String(left % 60).padStart(2, "0")}`
    : `${Math.floor(left / 60)}:${String(left % 60).padStart(2, "0")}`;
  el.innerHTML = "";
  const time = document.createElement("span");
  time.className = "tclock";
  time.textContent = ringing ? "time's up" : clock;
  // An unlabelled timer shows the clock alone — most timers are just "five
  // minutes", and inventing a name for them is worse than having none.
  if (timerState.label) {
    const label = document.createElement("span");
    label.className = "tlabel";
    label.textContent = timerState.label;
    el.append(label);
  }
  el.append(time);
  if (ringing) {
    const hint = document.createElement("span");
    hint.className = "thint";
    hint.textContent = "space, click, or “Neon, stop”";
    el.append(hint);
  }
}
setInterval(() => { if (timerState && timerState.active && !timerState.ringing) renderTimer(); }, 1000);

// ============================================================ render
function draw() {
  const t = now;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  // background with a soft vignette (or see-through in ghost mode)
  if (transparent) {
    ctx.clearRect(0, 0, W, H);
  } else {
    ctx.fillStyle = "#04060a";
    ctx.fillRect(0, 0, W, H);
  }
  // Everything after the backdrop fades together in deep sleep. The backdrop
  // itself stays opaque — it is what clears the canvas, so drawing it faded
  // would smear the previous frame instead of replacing it.
  ctx.globalAlpha = clamp(S.dim.v, 0, 1);
  if (!transparent) {
    const vg = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, Math.max(W, H) * 0.7);
    vg.addColorStop(0, "rgba(16,24,32,0.55)");
    vg.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, W, H);
  }

  const B = Math.min(W, H);          // base scale
  const eyeW = B * 0.20, eyeH = B * 0.26;
  const sep = B * 0.34;              // distance between eye centers
  const gazePx = B * 0.045;
  const th = S.think.v;  // thinking look: scan, lift, pulse, narrow
  const pulse = (Math.sin(t * 3.0) * 0.5 + 0.5) * 0.34 * th;
  const awakeGate = clamp(S.open.v, 0, 1);  // hearing cues only read on open eyes
  const lum = clamp(S.lum.v + speakAmp * 0.3 + pulse + hearAmp * 0.14 * awakeGate, 0, 1.1);

  // breathing & idle bob
  const asleepish = 1 - clamp(S.open.v, 0, 1);
  const breathe = Math.sin(t * (Math.PI * 2) / 4.2);
  const bobY = breathe * B * 0.008 * asleepish + Math.sin(t * 1.9) * B * 0.0035;
  const breatheOpen = breathe * 0.014 * asleepish;

  // fixation micro-drift, only meaningful while fairly awake
  const awakeness = clamp(S.open.v, 0, 1);
  const driftX = (Math.sin(t * 1.7) + Math.sin(t * 2.9) * 0.5) * 0.008 * awakeness;
  const driftY = (Math.sin(t * 1.3) + Math.sin(t * 2.3) * 0.5) * 0.006 * awakeness;

  const openEff = clamp((S.open.v - 0.30 * th) * S.blink.v + breatheOpen, 0.035, 1.18);
  // Thinking: slow left-right scan (reading something invisible) + upward bias
  const gx = S.gx.v + driftX + Math.sin(t * 1.15) * 0.42 * th;
  const gy = S.gy.v + driftY - 0.5 * th;

  for (const dir of [-1, 1]) {
    const cx = W / 2 + dir * sep / 2 + gx * gazePx;
    const cy = H / 2 + gy * gazePx * 0.8 + bobY;

    const wink = dir < 0 ? S.winkL.v : S.winkR.v;
    const pop = S.pop.v;
    const offY = (dir < 0 ? S.offL.v : S.offR.v) * eyeH;
    let h = eyeH * Math.min(openEff * wink, 1.18) * (1 + speakAmp * 0.05 + hearAmp * 0.06 * awakeGate) * pop;
    // slight sympathetic widening as lids close (squash & stretch)
    let w = eyeW * (1 + (1 - Math.min(openEff, 1)) * 0.10) * pop;
    // lids close mostly from the top: bias the visible slit downward
    const y = cy - h / 2 + (eyeH - Math.min(h, eyeH)) * 0.28 + offY;
    const x = cx - w / 2;
    const r = Math.min(w * 0.42, h / 2);

    const hue = 191 + 28 * th + S.hueX.v;  // indigo while reasoning; pink for love
    const topL = 40 + 32 * lum;
    const botL = 30 + 24 * lum;
    const grad = ctx.createLinearGradient(0, y, 0, y + h);
    grad.addColorStop(0, `hsl(${hue} 92% ${topL}%)`);
    grad.addColorStop(1, `hsl(${hue + 6} 96% ${botL}%)`);

    ctx.save();
    // Brow: clip away a slanted wedge off the top. With no eyebrows to draw,
    // the angle of the upper lid is the whole expression — inner-down reads
    // stern, outer-down reads sad.
    const brow = S.brow.v;
    if (Math.abs(brow) > 0.01) {
      const drop = Math.abs(brow) * h * 0.55;
      const inner = brow > 0 ? drop : 0, outer = brow > 0 ? 0 : drop;
      // dir -1 is the left eye, whose inner edge is on the right
      const yL = y + (dir < 0 ? outer : inner);
      const yR = y + (dir < 0 ? inner : outer);
      const pad = w;
      ctx.beginPath();
      ctx.moveTo(x - pad, yL);
      ctx.lineTo(x + w + pad, yR);
      ctx.lineTo(x + w + pad, y + h + pad);
      ctx.lineTo(x - pad, y + h + pad);
      ctx.clip();
    }
    // Crescent: subtract a circle rising from below, turning the eye into a
    // ^^ smile. Even-odd on rect+circle gives "rect minus circle".
    if (S.curve.v > 0.01) {
      const eaten = S.curve.v * h * 0.62;
      const R = w * 1.05;
      ctx.beginPath();
      ctx.rect(x - w, y - h, w * 3, h * 3);
      ctx.arc(cx, y + h + R - eaten, R, 0, Math.PI * 2);
      ctx.clip("evenodd");
    }

    // wide soft bloom pass
    ctx.save();
    ctx.shadowColor = `hsla(${hue}, 100%, 60%, ${0.35 + 0.3 * lum})`;
    ctx.shadowBlur = B * 0.10 * (0.4 + 0.6 * lum) * (1 + speakAmp * 0.6 + pulse * 1.4);
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.roundRect(x, y, w, h, r);
    ctx.fill();
    ctx.restore();

    // tight glow pass
    ctx.save();
    ctx.shadowColor = `hsla(${hue}, 100%, 70%, ${0.5 + 0.4 * lum})`;
    ctx.shadowBlur = B * 0.030;
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.roundRect(x, y, w, h, r);
    ctx.fill();
    ctx.restore();

    ctx.restore();  // brow / crescent clips
  }

  ctx.globalAlpha = 1;

  // (A screen-edge "hearing" glow lived here briefly; retired — recognizer
  // partials lag speech too much for it to feel live. Open eyes = listening.)
}

// ============================================================ main loop
let lastDraw = -1;
function frame(ms) {
  now = ms / 1000;
  runTasks();
  for (const k in S) tickCh(S[k]);
  speakAmp += (speakTarget - speakAmp) * 0.25;
  speakTarget *= 0.92;  // decay between amplitude updates
  hearAmp += (hearTarget - hearAmp) * 0.18;
  hearTarget *= 0.94;   // decays to stillness shortly after the voice stops
  if (preview) {
    // Preview override: pin the renderer to the chosen look every frame.
    if (state !== "awake" && state !== "waking") wake();
    if (state === "awake") awakeUntil = now + AWAKE_SECS;
    const wantThink = preview === "thinking";
    if (thinking !== wantThink) window.neon.thinking(wantThink);
    if (preview === "hearing") hearTarget = Math.max(hearTarget, 0.5 + Math.sin(now * 2.1) * 0.15);
    if (preview === "speaking") speakTarget = Math.max(speakTarget, 0.3 + (Math.sin(now * 3.7) * 0.5 + 0.5) * 0.55);
  }
  if (thinking && state === "awake") awakeUntil = now + AWAKE_SECS;
  // Watchdog: a "waking" that never handed off to "awake" (its completion
  // task got cancelled by a state race) would freeze the eyes open forever.
  if (state === "waking" && now - wakeStartedAt > 3) {
    state = "awake"; awakeUntil = now + AWAKE_SECS; saccadeLoop(); blinkLoop();
  }
  if (hold && state === "awake") awakeUntil = now + AWAKE_SECS;
  // Being actively spoken to is a reason to stay awake (pre-wake capture
  // of a long question must not drowse mid-sentence).
  if (hearAmp > 0.25 && state === "awake") awakeUntil = now + AWAKE_SECS;
  if (state === "awake" && now > awakeUntil) drowse();
  // Fully faded into deep sleep, nothing moves faster than the odd slow stir,
  // and this machine renders the eyes around the clock — 10 fps is plenty.
  if (!deep || S.dim.dur > 0 || now - lastDraw > 0.1) { draw(); lastDraw = now; }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ============================================================ external API
window.neon = {
  wake, sleep,
  // Session idle: begin the doze animation while the session stays open
  // (grace window); wake() snaps back if the speaker resumes.
  doze() { if (state === "awake") drowse(); },
  hold(b) { hold = !!b; if (!hold && state === "awake") awakeUntil = now + 2; },
  // Deep sleep is driven by the shell's idle clock rather than by the eyes:
  // the shell also takes the panel backlight down, and passes the render
  // level it wants so the two together land on "barely there", not "gone".
  // The fade is long enough that nobody in the room sees it happen.
  deepSleep(on, level) {
    on = !!on;
    if (on === deep) return;
    deep = on;
    if (on) {
      if (state !== "asleep" && state !== "sleeping") sleep();
      to(S.dim, typeof level === "number" ? level : 0.12, 6.0, easeInOutCubic);
    } else {
      to(S.dim, 1, 0.5, easeOutCubic);
    }
  },
  speaking(a) { speakTarget = Math.min(1, Math.max(0, a)); },
  hearing(a) { hearTarget = Math.max(hearTarget, Math.min(1, Math.max(0, a))); },
  debug(show) { document.getElementById("debug").style.display = show ? "flex" : "none"; },
  event(kind, text) { pushEvent(kind, text); },
  timer(state) {
    timerState = state ? { ...state, at: Date.now() } : null;
    renderTimer();
  },
  tasks(rows) {
    // Stamp arrival so the countdown stays honest without a push per second.
    taskList = rows.map(r => ({ ...r, at: Date.now() }));
    renderTasks();
  },
  events(show) {
    document.getElementById("events").style.display = show ? "block" : "none";
    if (show) evScroll();  // scrollHeight is 0 while hidden, so land at the tail now
  },
  transparent(on) {
    transparent = !!on;
    document.documentElement.style.background = on ? "transparent" : "";
    document.body.style.background = on ? "transparent" : "";
  },
  legend(show) { document.getElementById("legend").style.display = show ? "block" : "none"; },
  emote(name) {
    const fn = EMOTES[name];
    if (!fn) return;
    if (state !== "awake" && state !== "waking") wake();
    fn();
  },
  thinking(on) {
    on = !!on;
    if (on === thinking) return;
    thinking = on;
    to(S.think, on ? 1 : 0, on ? 0.5 : 0.35);
    if (!on) glanceTo(0, 0);    // come back to the room
  },
  stats(pairs) {
    document.getElementById("debug").innerHTML = pairs
      .map(([k, v]) => `<span>${k}<b>${v}</b></span>`)
      .join("");
  },
  get state() { return state; },
};
window.neon.previewNext = previewNext;
// X cycles through the emotes (badge names each) — for eyeballing them.
let emoteIx = -1;
function emoteNext() {
  const names = Object.keys(EMOTES);
  emoteIx = (emoteIx + 1) % names.length;
  badge(`emote: ${names[emoteIx]}`);
  window.neon.emote(names[emoteIx]);
}
window.neon.emoteNext = emoteNext;
// Keys are normally swallowed by the shell and re-issued through the API
// above; these bindings are for driving the page directly in a browser.
let evShown = false;
addEventListener("keydown", e => {
  if (e.key === " " || e.key === "w") wake();
  if (e.key === "s") sleep();
  if (e.key === "p") previewNext();
  if (e.key === "x") emoteNext();
  if (e.key === "l") { evShown = !evShown; window.neon.events(evShown); }
});
</script>
</body>
</html>
