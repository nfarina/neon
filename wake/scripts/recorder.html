<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hey neon — voice capture</title>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --line: #30363d;
    --text: #e6edf3; --dim: #8b949e;
    --accent: #39d3bb; --hot: #f85149; --ok: #3fb950;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg:#fff; --panel:#f6f8fa; --line:#d0d7de; --text:#1f2328; --dim:#656d76; --accent:#0f9b8a; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 2rem 1rem; background: var(--bg); color: var(--text);
    font: 15px/1.5 ui-sans-serif, -apple-system, "SF Pro Text", system-ui, sans-serif;
    display: flex; justify-content: center;
  }
  main { width: 100%; max-width: 620px; }
  h1 { font-size: 1.3rem; margin: 0 0 .25rem; letter-spacing: -.01em; }
  .sub { color: var(--dim); margin: 0 0 1.5rem; font-size: .9rem; }

  .modes { display: flex; gap: .5rem; margin-bottom: 1.25rem; }
  .modes button {
    flex: 1; padding: .6rem; border-radius: 8px; border: 1px solid var(--line);
    background: var(--panel); color: var(--dim); cursor: pointer; font: inherit;
  }
  .modes button[aria-pressed="true"] { border-color: var(--accent); color: var(--text); }

  .micbar { display: flex; gap: .5rem; align-items: center; margin-bottom: 1rem; font-size: .82rem; }
  .micbar select {
    flex: 1; min-width: 0; padding: .4rem; border-radius: 8px; font: inherit;
    background: var(--panel); color: var(--text); border: 1px solid var(--line);
  }
  #mic { color: var(--dim); white-space: nowrap; font-variant-numeric: tabular-nums; }
  #mic.live { color: var(--ok); }
  #mic.bad { color: var(--hot); }

  .stage {
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 1.5rem; text-align: center; margin-bottom: 1rem;
  }
  .prompt { font-size: 1.75rem; font-weight: 600; letter-spacing: -.02em; margin: 0 0 .35rem; }
  .hint { color: var(--dim); font-size: .9rem; min-height: 1.4em; margin: 0 0 1.1rem; }

  .meter { height: 6px; background: var(--line); border-radius: 99px; overflow: hidden; margin-bottom: 1.1rem; }
  .meter i { display: block; height: 100%; width: 0%; background: var(--accent); transition: width .05s linear; }

  #go {
    width: 100%; padding: .95rem; font: 600 1rem/1 inherit; cursor: pointer;
    border-radius: 10px; border: 1px solid var(--accent);
    background: var(--accent); color: #04231f;
  }
  #go[data-rec="1"] { background: var(--hot); border-color: var(--hot); color: #fff; }
  #go:disabled { opacity: .5; cursor: default; }
  kbd { background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: .05em .35em; font-size: .85em; }

  .bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: .6rem; font-size: .9rem; }
  .count b { color: var(--accent); font-size: 1.1rem; }
  ul { list-style: none; margin: 0; padding: 0; max-height: 260px; overflow-y: auto; }
  li { display: flex; align-items: center; gap: .6rem; padding: .45rem .6rem; border: 1px solid var(--line);
       border-radius: 8px; margin-bottom: .35rem; font-size: .85rem; }
  li span { flex: 1; color: var(--dim); font-variant-numeric: tabular-nums; }
  li button { background: none; border: none; color: var(--dim); cursor: pointer; font: inherit; padding: .1rem .3rem; }
  li button:hover { color: var(--hot); }
  .done { color: var(--ok); }
  .err { color: var(--hot); }
</style>
</head>
<body>
<main>
  <h1 id="title">voice capture</h1>
  <p class="sub">Saving to <code id="dest">…</code>. Aim for <b>40+</b> positives across varied
     distance, volume and pace, plus ~15 negatives.</p>

  <div class="modes">
    <button id="m-pos" aria-pressed="true">Positive</button>
    <button id="m-neg" aria-pressed="false">Negative — everything else</button>
  </div>

  <div class="micbar">
    <select id="dev" title="input device"></select>
    <span id="mic">mic: not started</span>
  </div>

  <div class="stage">
    <p class="prompt" id="prompt">hey neon</p>
    <p class="hint" id="hint">Press space, wait for "speak now", then say it</p>
    <div class="meter"><i id="level"></i></div>
    <button id="go">Record <kbd>space</kbd></button>
  </div>

  <div class="bar">
    <span class="count"><b id="n">0</b> <span id="kind">positive</span> clips saved</span>
    <span id="status" class="sub" style="margin:0"></span>
  </div>
  <ul id="list"></ul>
</main>

<script>
const DUR = 2.0, SR = 16000;
// Delay between the trigger and the start of capture. The spacebar press and
// its release are sharp broadband transients; if they land in the clip they sit
// at the start of every positive, and none of the synthetic clips have them —
// so "click" would correlate with real speech and the model could key on it.
const PREROLL = 650;

// The phrase, its delivery hints, and its near-miss prompts come from the
// server (`record_server.py --phrase`), so one capture path serves any wake
// phrase. Keeping it one page rather than a fork matters for the hey_jarvis
// A/B: if the control were recorded through a copy, a difference in the result
// could be the page rather than the model. Filled in by loadConfig().
let PHRASE = "…";
let POS_HINTS = ["loading…"];
let NEG_PROMPTS = ["loading…"];

const MIN_PEAK = 0.012;   // ~-38 dBFS; normal speech at arm's length clears this easily
let mode = "positive", recording = false, armed = false;
let ctx, stream, node, srcNode, chunks = [], srcRate, livePeak = 0;
const $ = id => document.getElementById(id);

function setMode(m) {
  mode = m;
  $("m-pos").ariaPressed = String(m === "positive");
  $("m-neg").ariaPressed = String(m === "negative");
  $("kind").textContent = m;
  refresh();
  nextPrompt();
}
$("m-pos").onclick = () => setMode("positive");
$("m-neg").onclick = () => setMode("negative");

async function loadConfig() {
  const c = await (await fetch("/config")).json();
  PHRASE = c.phrase;
  POS_HINTS = c.posHints;
  NEG_PROMPTS = c.negPrompts;
  document.title = `${PHRASE} — voice capture`;
  $("title").textContent = `${PHRASE} — voice capture`;
  $("m-pos").textContent = `Positive — "${PHRASE}"`;
  $("dest").textContent = c.dir;
  nextPrompt();
}

let posIdx = 0, negIdx = 0;
function nextPrompt() {
  if (mode === "positive") {
    $("prompt").textContent = PHRASE;
    $("hint").textContent = POS_HINTS[posIdx++ % POS_HINTS.length];
  } else {
    $("prompt").textContent = NEG_PROMPTS[negIdx % NEG_PROMPTS.length];
    $("hint").textContent = "Say this instead — teaches the model what NOT to fire on";
    negIdx++;
  }
}

function micStatus(text, cls = "") { const m = $("mic"); m.textContent = "mic: " + text; m.className = cls; }

function onAudio(e) {
  const buf = e.data;
  if (recording) chunks.push(buf);
  let peak = 0;
  for (let i = 0; i < buf.length; i++) peak = Math.max(peak, Math.abs(buf[i]));
  livePeak = Math.max(livePeak * 0.88, peak);          // brief decay so the bar is readable
  $("level").style.width = Math.min(100, livePeak * 140) + "%";
}

async function listDevices() {
  const devs = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === "audioinput");
  const cur = stream?.getAudioTracks()[0]?.getSettings().deviceId;
  const sel = $("dev");
  sel.innerHTML = "";
  devs.forEach((d, i) => {
    const o = document.createElement("option");
    o.value = d.deviceId;
    o.textContent = d.label || `input ${i + 1}`;
    if (d.deviceId === cur) o.selected = true;
    sel.append(o);
  });
}

async function initAudio(deviceId) {
  if (ctx && !deviceId) {
    // An AudioContext can come up (or fall back) to "suspended", in which case
    // the worklet never runs and every capture is digital silence.
    if (ctx.state !== "running") await ctx.resume();
    return;
  }
  if (stream) stream.getTracks().forEach(t => t.stop());

  // Keep the browser's DSP out of it: we want the raw signal, and the training
  // pipeline applies its own noise/reverb/gain augmentation.
  const audio = { channelCount: 1, echoCancellation: false, noiseSuppression: false, autoGainControl: false };
  if (deviceId) audio.deviceId = { exact: deviceId };
  stream = await navigator.mediaDevices.getUserMedia({ audio });

  if (!ctx) {
    ctx = new AudioContext();
    const workletSrc = `
      class Rec extends AudioWorkletProcessor {
        process(inputs) {
          const ch = inputs[0][0];
          if (ch) this.port.postMessage(new Float32Array(ch));
          return true;
        }
      }
      registerProcessor('rec', Rec);`;
    await ctx.audioWorklet.addModule(URL.createObjectURL(new Blob([workletSrc], { type: "text/javascript" })));
    node = new AudioWorkletNode(ctx, "rec");
    node.port.onmessage = onAudio;
    node.connect(ctx.destination);   // keep the graph pulling; worklet emits silence
  }
  if (ctx.state !== "running") await ctx.resume();

  srcRate = ctx.sampleRate;
  if (srcNode) srcNode.disconnect();
  srcNode = ctx.createMediaStreamSource(stream);
  srcNode.connect(node);

  await listDevices();
  const track = stream.getAudioTracks()[0];
  micStatus(`${track.label || "default"} · ${srcRate} Hz`, "live");
}

$("dev").onchange = e =>
  initAudio(e.target.value).catch(err => micStatus("error — " + err.message, "bad"));

// Try to bring the mic up immediately so the level bar can be checked before
// recording anything; if permission needs a gesture, the first press handles it.
initAudio().catch(() => micStatus("press record to enable", ""));

async function resample(data, from, to) {
  if (from === to) return data;
  const off = new OfflineAudioContext(1, Math.ceil(data.length * to / from), to);
  const buf = off.createBuffer(1, data.length, from);
  buf.copyToChannel(data, 0);
  const s = off.createBufferSource();
  s.buffer = buf; s.connect(off.destination); s.start();
  return (await off.startRendering()).getChannelData(0);
}

function toWav(samples, rate) {
  const buf = new ArrayBuffer(44 + samples.length * 2);
  const v = new DataView(buf);
  const str = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  str(0, "RIFF"); v.setUint32(4, 36 + samples.length * 2, true); str(8, "WAVE");
  str(12, "fmt "); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true);
  v.setUint16(32, 2, true); v.setUint16(34, 16, true);
  str(36, "data"); v.setUint32(40, samples.length * 2, true);
  for (let i = 0; i < samples.length; i++) {
    const s = Math.max(-1, Math.min(1, samples[i]));
    v.setInt16(44 + i * 2, s < 0 ? s * 0x8000 : s * 0x7fff, true);
  }
  return new Blob([buf], { type: "audio/wav" });
}

async function record() {
  if (recording || armed) return;
  try { await initAudio(); }
  catch (e) { $("status").innerHTML = '<span class="err">mic blocked: ' + e.message + '</span>'; return; }

  // Pre-roll: let the trigger transient decay before we start collecting.
  armed = true;
  $("go").textContent = "get ready…";
  $("status").textContent = "";
  await new Promise(r => setTimeout(r, PREROLL));

  chunks = []; recording = true;
  $("go").dataset.rec = "1"; $("go").textContent = "● speak now";
  await new Promise(r => setTimeout(r, DUR * 1000));
  recording = false; armed = false;
  $("go").dataset.rec = "0"; $("go").innerHTML = 'Record <kbd>space</kbd>';

  let total = 0; for (const c of chunks) total += c.length;
  if (total === 0) {
    $("status").innerHTML = '<span class="err">no audio captured — wrong input device? '
      + 'try the selector above</span>';
    micStatus("delivering no samples", "bad");
    return;
  }
  const flat = new Float32Array(total);
  let off = 0; for (const c of chunks) { flat.set(c, off); off += c.length; }

  let peak = 0; for (let i = 0; i < flat.length; i++) peak = Math.max(peak, Math.abs(flat[i]));
  if (peak < MIN_PEAK) {
    const db = peak > 0 ? (20 * Math.log10(peak)).toFixed(0) + " dBFS" : "digital silence";
    $("status").innerHTML = `<span class="err">too quiet — peak ${db}, need ${
      (20 * Math.log10(MIN_PEAK)).toFixed(0)} dBFS. Watch the bar while you speak;
      if it never moves, pick a different input above.</span>`;
    return;
  }

  const wav = toWav(await resample(flat, srcRate, SR), SR);
  const fd = new FormData();
  fd.append("audio", wav, "clip.wav");
  const res = await fetch(`/upload?kind=${mode}`, { method: "POST", body: fd });
  const j = await res.json();
  $("status").innerHTML = `<span class="done">saved ${j.name}</span>`;
  refresh();
  nextPrompt();
}

async function refresh() {
  const r = await fetch(`/list?kind=${mode}`);
  const j = await r.json();
  $("n").textContent = j.files.length;
  $("list").innerHTML = "";
  for (const f of j.files.slice().reverse()) {
    const li = document.createElement("li");
    const audio = document.createElement("audio");
    audio.controls = true; audio.preload = "none";
    audio.src = `/clip?kind=${mode}&name=${encodeURIComponent(f)}`;
    audio.style.height = "28px";
    const label = document.createElement("span");
    label.textContent = f;
    const del = document.createElement("button");
    del.textContent = "delete"; del.title = "remove this clip";
    del.onclick = async () => {
      await fetch(`/delete?kind=${mode}&name=${encodeURIComponent(f)}`, { method: "POST" });
      refresh();
    };
    li.append(audio, label, del);
    $("list").append(li);
  }
}

$("go").onclick = record;
addEventListener("keydown", e => {
  if (e.code === "Space" && !e.repeat && e.target.tagName !== "BUTTON") { e.preventDefault(); record(); }
});
setMode("positive");
loadConfig().catch(e => { $("hint").textContent = "could not load config: " + e.message; });
</script>
</body>
</html>
