# Training config for the "hey neon" wake word model.
# Field documentation: config/_reference_custom_model.yml
# Paths are as seen inside the container (project root mounted at /work).

model_name: "hey_neon"

target_phrase:
  - "hey neon"

custom_negative_phrases: []

# 20k is the config's recommended minimum for a quality model. At ~1.3 clips/s
# (CPU-bound in Piper) a full regeneration of all four sets is roughly 9 hours.
n_samples: 20000
n_samples_val: 1000

tts_batch_size: 50
augmentation_batch_size: 16

piper_sample_generator_path: "/opt/piper-sample-generator"

output_dir: "/work/output/hey_neon"

rir_paths:
  - "/work/data/mit_rirs"

background_paths:
  - "/work/data/audioset_16k"
  - "/work/data/fma"

background_paths_duplication_rate:
  - 1
  - 1

false_positive_validation_data_path: "/work/data/validation_set_features.npy"

# Reuse each synthetic clip twice with different random augmentation —
# cheap data multiplication given CPU-bound TTS generation.
augmentation_rounds: 2

feature_data_files:
  "ACAV100M_sample": "/work/data/openwakeword_features_ACAV100M_2000_hrs_16bit.npy"

batch_n_per_class:
  "ACAV100M_sample": 1024
  "adversarial_negative": 50
  "positive": 50

model_type: "dnn"
layer_size: 32

steps: 50000

max_negative_weight: 1500
target_false_positives_per_hour: 0.2
target_accuracy: 0.7
target_recall: 0.5
